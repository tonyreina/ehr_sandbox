[workspace]
authors = ["Tony Reina <tbreina@bu.edu>"]
channels = ["conda-forge"]
name = "ehr_sandbox"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
patient            = "python cli.py patient"
observations       = "python cli.py observations"
generate-keys      = "python cli.py generate-keys"
generate-keys-force = "python cli.py generate-keys --force"
list-patients      = "python cli.py list-patients"
list-ehrs          = "python cli.py list-ehrs"
docs               = "zensical serve"
smart-setup        = "python cli.py smart-setup"
smart-app          = "python cli.py smart-app"
hapi-up            = "python cli.py hapi-up"
hapi-down          = "python cli.py hapi-down"
hapi-load          = "python cli.py hapi-load"
hapi-scenarios     = "python cli.py hapi-scenarios"
codex-setup        = "python cli.py codex-setup"
codex-check        = "python cli.py codex-check"

[dependencies]
python = ">=3.15.0,<3.16"
python-dotenv = ">=1.2.4,<2"
requests = ">=2.34.2,<3"
fhirclient = ">=4.4.0,<5"
cryptography = ">=50.0.2,<51"
pyjwt = ">=2.15.1,<3"
typer = ">=0.27.3,<0.28"
zensical = ">=0.0.70,<0.0.71"
hatchling = ">=1.27.0,<2"

[pypi-dependencies]
ehr-sandbox = { path = ".", editable = true }
