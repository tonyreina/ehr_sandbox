<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SMART Launch</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
  <script src="config.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script src="__ehr.js" onerror="void 0"></script>
  <script src="lib.js"></script>
</head>
<body style="font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem">
  <p id="msg">Redirecting to the sign-in page…</p>
  <script>
    // Handles both flows for every EHR profile:
    //   EHR launch  : the EHR opens  launch.html?iss=<fhir base>&launch=<token>
    //   Standalone  : the dashboard opens  launch.html?ehr=<profile>  and the app starts the login
    const params = new URLSearchParams(window.location.search);
    const cfg = window.SMART_CONFIG, msg = document.getElementById("msg");
    const key = chooseProfile(cfg, { iss: params.get("iss"), ehrParam: params.get("ehr"), def: window.SMART_DEFAULT_EHR });
    const profile = cfg.profiles[key];
    const ehrLaunch = params.has("launch");
    const iss = params.get("iss") || profile.standaloneIss;
    const clientId = params.get("client_id") || clientIdFor(key, cfg, window.SMART_LOCAL);

    if (!clientId) {
      msg.textContent = `No ${profile.name} client id. Run: pixi run smart-setup --ehr ${key}  (or pass ?client_id=...)`;
    } else if (!iss) {
      msg.textContent = `${profile.name} can't start the login itself. ${profile.launchHint || ""}`;
    } else {
      // Remember which EHR this sign-in is for: the redirect back to index.html carries no ehr param.
      try { sessionStorage.setItem("smart_ehr", key); } catch (e) { /* storage blocked: default profile is used */ }
      // Scopes must match what the app registered with the EHR (no wildcards).
      // Override the prefix with ?scope_prefix=patient or ?scope_prefix=user.
      const scope = scopesFor(profile, { ehrLaunch, prefixOverride: params.get("scope_prefix") });
      FHIR.oauth2.authorize({ clientId, scope, redirectUri: cfg.redirectUri, iss })
        .catch(e => { msg.textContent = "Launch failed: " + e.message; });
    }
  </script>
</body>
</html>
