<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Chart</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
  <script src="config.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script src="__ehr.js" onerror="void 0"></script>
  <script src="lib.js"></script>
  <script src="charts.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">+</span>FHIR Sandbox Chart</div>
    <div class="appbar-tools">
      <div id="ehr-bar" class="tool">
        <label for="ehr-select">EHR</label>
        <select id="ehr-select"></select>
        <button id="signin" type="button" hidden>Sign in</button>
      </div>
      <form id="picker" class="tool" hidden>
        <label for="patient-select">Patient</label>
        <select id="patient-select"></select>
        <input id="search" type="search" placeholder="Find patient by name" size="18" aria-label="Search patients by name">
        <input id="search-dob" type="date" aria-label="Birth date" title="Birth date (required by this EHR)" hidden>
        <button id="search-btn" type="submit">Search</button>
      </form>
    </div>
  </header>

  <div class="strip">
    <p id="mode"></p>
    <p id="notice" class="error" role="alert" hidden></p>
    <p id="status" role="status"></p>
  </div>

  <div id="dash" hidden>
    <section class="banner" aria-label="Patient banner">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="banner-main">
        <h1 id="name"></h1>
        <p id="demographics"></p>
      </div>
      <div class="banner-chips">
        <span class="chip chip-alert" id="chip-allergies">Allergies: loading…</span>
        <span class="chip" id="chip-problems">Problems: loading…</span>
        <span class="chip" id="chip-source"></span>
      </div>
    </section>

    <div class="layout">
      <nav class="sidebar" aria-label="Chart sections">
        <a href="#sec-summary">Summary</a>
        <a href="#sec-vitals">Vitals</a>
        <a href="#sec-flowsheet">Flowsheet</a>
        <a href="#sec-results">Results</a>
        <a href="#sec-meds">Medications</a>
        <a href="#sec-allergies">Allergies</a>
        <a href="#sec-encounters">Encounters</a>
        <a href="#sec-problems">Problems</a>
      </nav>

      <main>
        <section class="panel" id="sec-summary">
          <h2 class="panel-head">Summary <span class="panel-sub">latest vitals</span></h2>
          <div class="panel-body"><div id="tiles" class="tiles"></div></div>
        </section>

        <section class="panel" id="sec-vitals">
          <h2 class="panel-head">Vitals <span class="panel-sub">trends</span></h2>
          <div class="panel-body">
            <p id="future-note" class="muted" hidden></p>
            <div id="charts" class="grid"></div>
          </div>
        </section>

        <section class="panel" id="sec-flowsheet">
          <h2 class="panel-head">Flowsheet <span class="panel-sub">last reading per day</span></h2>
          <div class="panel-body" id="flowsheet"></div>
        </section>

        <section class="panel" id="sec-results">
          <h2 class="panel-head">Results <span class="panel-sub">laboratory</span></h2>
          <div class="panel-body" id="labs"></div>
        </section>

        <section class="panel" id="sec-meds">
          <h2 class="panel-head">Medications</h2>
          <div class="panel-body" id="meds"></div>
        </section>

        <div class="grid two">
          <section class="panel" id="sec-allergies">
            <h2 class="panel-head">Allergies</h2>
            <div class="panel-body" id="allergies"></div>
          </section>
          <section class="panel" id="sec-encounters">
            <h2 class="panel-head">Encounters</h2>
            <div class="panel-body" id="encounters"></div>
          </section>
        </div>

        <section class="panel" id="sec-problems">
          <h2 class="panel-head">Problem list</h2>
          <div class="panel-body" id="conditions"></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
